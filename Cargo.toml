[workspace]
resolver = "2"
members = [
    "crates/wny-core",
    "crates/wny-egress",
    "crates/wny-cli",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/wny-app/wny"

[workspace.dependencies]
wny-core = { path = "crates/wny-core" }
wny-egress = { path = "crates/wny-egress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
directories = "5"
parking_lot = "0.12"
