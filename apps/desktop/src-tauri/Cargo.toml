[package]
name = "wny-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WNY desktop (Windows, macOS). Requires Rust 1.90+ for Tauri 2."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
wny-core = { path = "../../../crates/wny-core" }
wny-egress = { path = "../../../crates/wny-egress" }

[lib]
name = "wny_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "wny-desktop"
path = "src/main.rs"
