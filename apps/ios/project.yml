name: WNY
options:
  bundleIdPrefix: org.wny
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.wny.app
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  WNY:
    type: application
    platform: iOS
    sources:
      - WNY
    resources:
      - path: WNY/en.json
      - path: WNY/tr.json
      - path: WNY/de.json
    entitlements:
      path: WNY/WNY.entitlements
    dependencies:
      - target: WNYTunnel
        embed: true
        codeSign: true
  WNYTunnel:
    type: app-extension
    platform: iOS
    sources:
      - WNYTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wny.app.tunnel
        INFOPLIST_FILE: WNYTunnel/Info.plist
    entitlements:
      path: WNYTunnel/WNYTunnel.entitlements
