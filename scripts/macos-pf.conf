# WNY L0 pf anchor (macOS). Loaded by the desktop helper, not by the user.
# Default deny while WNY is on. Allow loopback, TUN, and ARCHITECTURE.md endpoints.

anchor "com.wny"
load anchor "com.wny" from "/Library/Application Support/WNY/pf.anchor"

# /Library/Application Support/WNY/pf.anchor is generated at engage() from policy/allowlist.json:
#   block drop out proto {tcp,udp} to any port {53,80}
#   pass out proto tcp to {9.9.9.9,1.1.1.1,185.222.222.222} port {443,853}
#   pass out proto udp to {162.159.192.0/24} port {2408,500,1701}
#   pass out on utun* from 198.18.0.0/15
